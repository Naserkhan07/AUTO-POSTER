name: Auto-Poster Scheduled Automation

on:
  schedule:
    # Run every 15 minutes automatically
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Setup YouTube Token
        if: ${{ env.YOUTUBE_TOKEN_JSON != '' }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: Setup YouTube Cookies
        if: ${{ env.YOUTUBE_COOKIES != '' }}
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt

      - name: Run Auto-Poster Pipeline
        env:
          RIGHTS_ACKNOWLEDGED: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          UPLOAD_FACEBOOK: "true"
          UPLOAD_INSTAGRAM: "true"
          UPLOAD_YOUTUBE: ${{ secrets.YOUTUBE_TOKEN_JSON != '' && 'true' || 'false' }}
          YTDLP_COOKIE_FILE: ${{ hashFiles('cookies.txt') != '' && 'cookies.txt' || '' }}
        run: |
          python main.py --once

      - name: Publish Live Mission Control Dashboard to GitHub Summary
        if: always()
        run: |
          python dashboard.py --summary >> $GITHUB_STEP_SUMMARY
          python dashboard.py --html public/index.html

      - name: Upload Live Dashboard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mission-control-dashboard
          path: public/index.html

      - name: Sync Updated Queue and Logs to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add links.txt work/downloaded-links.log || true
          git commit -m "chore(autopilot): update links.txt queue [skip ci]" || true
          git push || true
