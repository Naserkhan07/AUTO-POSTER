name: Auto-Poster Scheduled Automation

on:
  schedule:
    # Run every 15 minutes automatically
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Setup YouTube Token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            printf '%s\n' "$YOUTUBE_TOKEN_JSON" > youtube_token.json
            echo "UPLOAD_YOUTUBE=true" >> $GITHUB_ENV
          fi

      - name: Setup YouTube Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt
            echo "YTDLP_COOKIE_FILE=cookies.txt" >> $GITHUB_ENV
            echo "YouTube cookies successfully loaded."
          fi

      - name: Cache Gameplay Footage Assets
        uses: actions/cache@v4
        with:
          path: assets/gameplay
          key: gameplay-footage-${{ runner.os }}-v1
          restore-keys: |
            gameplay-footage-${{ runner.os }}-

      - name: Ensure Real Gameplay Footage (GTA V, Minecraft, Subway Surfers)
        run: |
          python -c "from shorts_bot.gameplay import GameplayManager; GameplayManager().ensure_all_categories_ready()"

      - name: Run Auto-Poster Pipeline
        env:
          RIGHTS_ACKNOWLEDGED: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          UPLOAD_FACEBOOK: "true"
          UPLOAD_INSTAGRAM: "true"
        run: |
          python main.py --once

      - name: Publish Live Mission Control Dashboard to GitHub Summary
        if: always()
        run: |
          python dashboard.py --summary >> $GITHUB_STEP_SUMMARY
          python dashboard.py --html public/index.html
          echo ""
          echo "================================================================================="
          echo "🚀 AUTO-POSTER MISSION CONTROL DASHBOARD IS LIVE!"
          echo "👉 Click this link to open the Summary tab on GitHub:"
          echo "   https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "👉 Localhost Port (if you run locally on PC): http://localhost:5050"
          echo "================================================================================="

      - name: Upload Live Dashboard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mission-control-dashboard
          path: public/index.html

      - name: Sync Updated Queue and Logs to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add links.txt work/downloaded-links.log || true
          git commit -m "chore(autopilot): update links.txt queue [skip ci]" || true
          git push || true
